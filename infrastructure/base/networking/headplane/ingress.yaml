apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headplane
  namespace: headscale
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd,headscale-headplane-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - headplane.shublab.com
      secretName: shublab-wildcard-tls
  rules:
    - host: headplane.shublab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headplane
                port:
                  number: 3000
