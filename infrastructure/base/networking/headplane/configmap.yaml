apiVersion: v1
kind: ConfigMap
metadata:
  name: headplane-config
  namespace: headscale
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 3000
      base_url: "https://headplane.shublab.com"
      cookie_secret_path: "/secrets/cookie-secret"
      cookie_secure: true
      cookie_max_age: 2592000
      data_path: "/var/lib/headplane"

    headscale:
      url: "http://headscale:8080"
      api_key_path: "/secrets/api-key"
      config_path: "/etc/headscale/config.yaml"
