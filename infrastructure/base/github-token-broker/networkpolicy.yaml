# Only pods in the hermes-agent namespace may even open a connection to
# the broker's port - defense in depth alongside the TokenReview identity
# check the broker itself performs. No egress rules here on purpose:
# Cilium only enforces default-deny for a traffic direction once a policy
# defines rules for it, so leaving `egress` unset keeps the broker's
# outbound access (GitHub API, kube-apiserver for TokenReview, DNS) fully
# open while ingress becomes strictly allow-listed.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: github-token-broker-ingress
  namespace: github-token-broker
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": hermes-agent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
