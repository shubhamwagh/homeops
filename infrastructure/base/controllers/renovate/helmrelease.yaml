apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: renovate
spec:
  interval: 30m
  chart:
    spec:
      chart: renovate
      version: "46.*"
      sourceRef:
        kind: HelmRepository
        name: renovate
        namespace: renovate
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Dedicated identity (2026-08-24) so Renovate can mint a GitHub App
    # token from github-homeops-broker instead of authoring PRs under a
    # personal PAT - that made every Renovate PR permanently unmergeable
    # (branch protection blocks self-approval, no second human account
    # exists to review them). Never the shared `default` SA - the broker's
    # TokenReview allowlist checks this exact ServiceAccount identity.
    serviceAccount:
      create: true
      name: renovate-token-fetcher

    extraVolumes:
      - name: shared-token
        emptyDir: {}

    extraVolumeMounts:
      - name: shared-token
        mountPath: /shared
        readOnly: true

    cronjob:
      schedule: "0 2 * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      # Mints a fresh token per run via github-homeops-broker's TokenReview
      # flow (own SA token in, short-lived GitHub App installation token
      # out) and writes it to a shared emptyDir - never a static credential
      # in a Secret. stdlib-only (matches the broker's own minimal-
      # dependency philosophy), no pip install needed in the init container.
      initContainers:
        - name: fetch-homeops-token
          image: python:3.13-slim
          command: ["python3", "-c"]
          args:
            - |
              import json, os, urllib.request
              with open("/var/run/secrets/kubernetes.io/serviceaccount/token") as f:
                  sa_token = f.read().strip()
              req = urllib.request.Request(
                  "http://github-homeops-broker.github-homeops-broker.svc.cluster.local/v1/token",
                  method="POST",
                  headers={"Authorization": f"Bearer {sa_token}"},
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.load(resp)
              with open("/shared/token", "w") as f:
                  f.write(data["token"])
              # World-readable, not 0600: the init container (UID 10000) and
              # the renovate image's main container run as different UIDs,
              # and there's no shared fsGroup here. Fine to be readable -
              # this emptyDir is scoped to this one pod only and the token
              # expires in ~1h regardless (real incident 2026-08-24: 0600
              # caused "Permission denied" reading it back, silently empty
              # RENOVATE_TOKEN, Renovate's own "must configure a token" error).
              os.chmod("/shared/token", 0o644)
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: shared-token
              mountPath: /shared
      # Runs in the SAME shell session as `renovate` (chart wraps both in
      # one /bin/bash -c script), so this export is visible to it.
      preCommand: |
        export RENOVATE_TOKEN="$(cat /shared/token)"

    renovate:
      config: |
        {
          "platform": "github",
          "repositories": ["shubhamwagh/homeops"],
          "schedule": ["after 2am and before 4am"],
          "timezone": "Europe/London",
          "automerge": false,
          "dependencyDashboard": true,
          "requireConfig": "optional",
          "semanticCommits": "enabled",
          "separateMajorMinor": true,
          "separateMinorPatch": false,
          "labels": ["dependencies", "renovate"],
          "reviewers": ["shubhamwagh"],
          "flux": {
            "managerFilePatterns": [
              "/(^|/)clusters\\/staging\\/flux-system\\/gotk-components\\.ya?ml$/"
            ]
          },
          "kubernetes": {
            "managerFilePatterns": [
              "/(^|/)apps\\/base\\/.+\\/deployment\\.ya?ml$/",
              "/(^|/)infrastructure\\/base\\/.+\\/deployment\\.ya?ml$/"
            ]
          },
          "helm-values": {
            "managerFilePatterns": [
              "/(^|/)apps\\/base\\/.+\\/helmrelease.*\\.ya?ml$/",
              "/(^|/)infrastructure\\/base\\/.+\\/helmrelease.*\\.ya?ml$/"
            ]
          },
          "packageRules": [
            {
              "matchUpdateTypes": ["patch"],
              "matchCategories": ["infrastructure"],
              "groupName": "Infrastructure - Patch Updates",
              "automerge": false
            },
            {
              "matchUpdateTypes": ["minor"],
              "matchCategories": ["infrastructure"],
              "groupName": "Infrastructure - Minor Updates",
              "automerge": false
            },
            {
              "matchUpdateTypes": ["major"],
              "groupName": "{{depName}} - Major Update",
              "labels": ["major-update", "needs-review"],
              "automerge": false
            },
            {
              "matchPackagePatterns": ["flux", "cert-manager", "traefik", "longhorn"],
              "labels": ["critical-infrastructure"],
              "automerge": false
            },
            {
              "matchDatasources": ["docker"],
              "versioning": "docker"
            },
            {
              "matchDatasources": ["helm"],
              "versioning": "helm"
            }
          ]
        }

    env:
      - name: LOG_LEVEL
        value: info

    # RENOVATE_TOKEN now comes from cronjob.preCommand (fresh per run via
    # github-homeops-broker) - see above. The old renovate-github-token
    # PAT secret is no longer wired in; the actual GitHub PAT should be
    # revoked once this is confirmed working (secret file left in place
    # for now, not referenced by anything).

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
