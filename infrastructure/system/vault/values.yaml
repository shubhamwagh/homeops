# Vault — single replica, Raft storage on Longhorn
# Security hardened following buun-stack pattern

injector:
  enabled: false

csi:
  enabled: false

server:
  image:
    repository: hashicorp/vault
    tag: "1.18"

  statefulSet:
    securityContext:
      pod:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      container:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi

  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable     = 1
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "raft" {
        path = "/vault/data"
      }

      service_registration "kubernetes" {}

  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: longhorn

  readinessProbe:
    enabled: true
    path: /v1/sys/health?standbyok=true&uninitcode=204&sealedcode=204

ui:
  enabled: true
  serviceType: ClusterIP
