# Adds home.didcot zone forwarding to CoreDNS
# Forwards *.home.didcot queries to AdGuard so pods inside the cluster
# can resolve homelab hostnames (needed for Vault OIDC → Keycloak, etc.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  home.didcot.server: |
    home.didcot:53 {
        errors
        cache 30
        forward . 192.168.0.3
    }
