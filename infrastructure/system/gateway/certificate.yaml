# Wildcard cert for all *.home.didcot services — issued by the homelab CA
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-home-didcot
  namespace: kube-system
spec:
  secretName: wildcard-home-didcot
  commonName: "*.home.didcot"
  dnsNames:
    - "*.home.didcot"
    - home.didcot
  duration: 8760h    # 1 year
  renewBefore: 720h  # renew 30 days before expiry
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: homelab-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
