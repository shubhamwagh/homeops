# Redirect all HTTP → HTTPS
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# AdGuard Home
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard
  namespace: adguard
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - adguard.home.didcot
  rules:
    - backendRefs:
        - name: adguard-home
          port: 80
---
# Longhorn
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
