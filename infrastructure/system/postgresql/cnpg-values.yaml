# CloudNativePG Operator
# Manages PostgreSQL clusters as Kubernetes-native resources
# Namespace is labeled privileged — CNPG requires it for the operator itself

# Monitoring via Prometheus (enabled when kube-prometheus-stack is installed)
monitoring:
  podMonitorEnabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
