apiVersion: v1
kind: Service
metadata:
  name: adguard-home
  namespace: adguard
  annotations:
    lbipam.cilium.io/ips: "192.168.0.3"
spec:
  type: LoadBalancer
  selector:
    app: adguard-home
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
    - name: web-ui
      port: 80
      protocol: TCP
      targetPort: 80
    - name: setup-ui
      port: 3000
      protocol: TCP
      targetPort: 3000
