apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: skypilot
  namespace: skypilot
spec:
  parentRefs:
    - name: homelab
      namespace: kube-system
      sectionName: https
  hostnames:
    - skypilot.home.didcot
  rules:
    - backendRefs:
        - name: skypilot-api-service
          port: 80
