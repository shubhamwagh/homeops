---
# Longhorn requires open-iscsi on every node
- name: Install Longhorn prerequisites
  hosts: all
  become: true
  tasks:
    - name: Install open-iscsi
      ansible.builtin.apt:
        name: open-iscsi
        state: present
        update_cache: true

    - name: Enable and start iscsid
      ansible.builtin.systemd:
        name: iscsid
        enabled: true
        state: started

    - name: Configure multipath to ignore Longhorn iSCSI volumes
      ansible.builtin.copy:
        dest: /etc/multipath.conf
        content: |
          defaults {
              user_friendly_names yes
          }

          blacklist {
              device {
                  vendor "IET"
                  product "VIRTUAL-DISK"
              }
          }
        owner: root
        group: root
        mode: "0644"

    - name: Restart multipathd to apply blacklist
      ansible.builtin.systemd:
        name: multipathd
        state: restarted
