apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: main-l2-policy
  namespace: kube-system
spec:
  # Matches common Linux NIC names, and wireless interfaces
  interfaces:
    - enp.*
    - eno.*
    - eth.*
    - ens.*
    - wlan.*
    - wlp.*
  loadBalancerIPs: true
  externalIPs: true
