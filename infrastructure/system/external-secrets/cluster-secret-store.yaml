apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      # In-cluster Vault address — switch to external URL when Cloudflare Tunnel is set up
      server: "http://vault.vault.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          # Vault Kubernetes auth mount
          mountPath: "kubernetes"
          # Vault role bound to the ESO service account
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
