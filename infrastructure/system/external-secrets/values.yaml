# External Secrets Operator
# Syncs secrets from Vault KV-v2 into Kubernetes Secrets
# ClusterSecretStore is created post-install pointing to in-cluster Vault
installCRDs: true

replicaCount: 1

# Restricted pod security (matches namespace label)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
