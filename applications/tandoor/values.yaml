image:
  repository: vabene1111/recipes
  tag: latest
  pullPolicy: Always

sidecar:
  image:
    repository: nginx
    tag: latest
    pullPolicy: IfNotPresent
  config:
    client_max_body_size: "128M"
    reverse_proxy_header_username: x_authentik_username

env:
  TZ: "Europe/London"
  DEBUG: "0"
  ALLOWED_HOSTS: "*"
  SECRET_KEY:
    valueFrom:
      secretKeyRef:
        name: tandoor-secret
        key: SECRET_KEY
  CSRF_TRUSTED_ORIGINS: "https://tandoor.home.didcot"
  DB_ENGINE: django.db.backends.postgresql
  POSTGRES_HOST: tandoor-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: tandoor
  POSTGRES_USER: tandoor
  POSTGRES_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: tandoor-secret
        key: POSTGRES_PASSWORD
  GUNICORN_MEDIA: "0"

service:
  main:
    ports:
      http:
        port: 80

persistence:
  media:
    enabled: true
    storageClass: longhorn
    accessMode: ReadWriteOnce
    size: 2Gi
    mountPath: /opt/recipes/mediafiles
  static:
    enabled: true
    type: emptyDir
    mountPath: /opt/recipes/staticfiles
