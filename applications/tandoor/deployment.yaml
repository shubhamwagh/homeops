apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipes
  namespace: tandoor
  labels:
    app: recipes
    tier: frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: recipes
      tier: frontend
  template:
    metadata:
      labels:
        app: recipes
        tier: frontend
    spec:
      initContainers:
        - name: init-tandoor
          image: vabene1111/recipes:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              set -e
              source venv/bin/activate
              echo "Waiting for postgres..."
              until python -c "
              import psycopg2, os, sys
              try:
                psycopg2.connect(host=os.environ['POSTGRES_HOST'], port=5432, dbname=os.environ['POSTGRES_DB'], user=os.environ['POSTGRES_USER'], password=os.environ['POSTGRES_PASSWORD'])
                sys.exit(0)
              except Exception as e:
                print(e); sys.exit(1)
              "; do sleep 2; done
              echo "Running migrations..."
              python manage.py migrate
              echo "Collecting static files..."
              python manage.py collectstatic --noinput
              echo "Setting permissions..."
              chown -R 65534:65534 /opt/recipes/mediafiles
              find /opt/recipes/mediafiles -type d | xargs -r chmod 755
              find /opt/recipes/mediafiles -type f | xargs -r chmod 644
              echo "Init done."
          securityContext:
            runAsUser: 0
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tandoor-secret
                  key: SECRET_KEY
            - name: DB_ENGINE
              value: django.db.backends.postgresql
            - name: POSTGRES_HOST
              value: postgres-cluster-rw.postgres.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: tandoor
            - name: POSTGRES_USER
              value: tandoor
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tandoor-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - mountPath: /opt/recipes/mediafiles
              name: media
              subPath: files
            - mountPath: /opt/recipes/staticfiles
              name: static
              subPath: files
      containers:
        - name: recipes-nginx
          image: public.ecr.aws/nginx/nginx-unprivileged:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - mountPath: /media
              name: media
              subPath: files
            - mountPath: /static
              name: static
              subPath: files
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
        - name: recipes
          image: vabene1111/recipes:latest
          imagePullPolicy: IfNotPresent
          command:
            - /opt/recipes/venv/bin/gunicorn
            - -b
            - :8081
            - --access-logfile
            - "-"
            - --error-logfile
            - "-"
            - --log-level
            - INFO
            - recipes.wsgi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: DEBUG
              value: "0"
            - name: ALLOWED_HOSTS
              value: "*"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tandoor-secret
                  key: SECRET_KEY
            - name: GUNICORN_MEDIA
              value: "0"
            - name: DB_ENGINE
              value: django.db.backends.postgresql
            - name: POSTGRES_HOST
              value: postgres-cluster-rw.postgres.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: tandoor
            - name: POSTGRES_USER
              value: tandoor
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tandoor-secret
                  key: POSTGRES_PASSWORD
            - name: CSRF_TRUSTED_ORIGINS
              value: "https://tandoor.home.didcot"
            - name: TZ
              value: "Europe/London"
            - name: SOCIAL_PROVIDERS
              value: "allauth.socialaccount.providers.openid_connect"
            - name: SOCIALACCOUNT_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: tandoor-secret
                  key: SOCIALACCOUNT_PROVIDERS
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/homelab/ca.crt
          securityContext:
            runAsUser: 65534
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - mountPath: /opt/recipes/mediafiles
              name: media
              subPath: files
            - mountPath: /opt/recipes/staticfiles
              name: static
              subPath: files
            - mountPath: /etc/ssl/homelab
              name: homelab-ca
              readOnly: true
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: recipes-media
        - name: static
          persistentVolumeClaim:
            claimName: recipes-static
        - name: homelab-ca
          secret:
            secretName: homelab-ca-secret
            items:
              - key: tls.crt
                path: ca.crt
        - name: nginx-config
          configMap:
            name: recipes-nginx-config
