apiVersion: apps/v1
kind: Deployment
metadata:
  name: better-booking-bot
  namespace: better-booking-bot
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: better-booking-bot
  template:
    metadata:
      labels:
        app: better-booking-bot
    spec:
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - "test -f /data/config.yaml || cp /seed/config.yaml /data/config.yaml"
          volumeMounts:
            - name: seed
              mountPath: /seed
            - name: data
              mountPath: /data
      containers:
        - name: daemon
          image: ghcr.io/shubhamwagh/better-booking-bot:latest
          command: ["python", "-m", "better_bot.daemon"]
          envFrom:
            - secretRef:
                name: better-booking-bot-creds
            - secretRef:
                name: better-booking-bot-card
          env:
            - name: CONFIG_PATH
              value: /data/config.yaml
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        - name: webui
          image: ghcr.io/shubhamwagh/better-booking-bot:latest
          command: ["python", "-m", "better_bot.webui"]
          env:
            - name: CONFIG_PATH
              value: /data/config.yaml
            - name: PORT
              value: "8080"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: seed
          configMap:
            name: better-booking-bot-config-seed
        - name: data
          persistentVolumeClaim:
            claimName: better-booking-bot-data
