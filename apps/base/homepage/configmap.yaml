apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  settings.yaml: |
    title: Shubham's Homelab
    background:
      image: https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1920&q=80
      blur: sm
      saturate: 50
      brightness: 50
      opacity: 30
    theme: dark
    color: slate
    headerStyle: boxed
    cardBlur: sm
    statusStyle: dot
    layout:
      Networking:
        style: row
        columns: 3
        icon: mdi-network
      Infrastructure:
        style: row
        columns: 3
        icon: mdi-server
      Security:
        style: row
        columns: 3
        icon: mdi-shield-lock
      Monitoring:
        style: row
        columns: 3
        icon: mdi-chart-line
      Applications:
        style: row
        columns: 4
        icon: mdi-apps

  bookmarks.yaml: |
    - Quick Links:
        - GitHub:
            - href: https://github.com/shubhamwagh/homeops
              icon: si-github
        - Cloudflare:
            - href: https://dash.cloudflare.com
              icon: si-cloudflare

  services.yaml: |
    - Networking:
        - Traefik:
            href: https://traefik.shublab.com
            icon: traefik.png
            description: Ingress Controller
        - Headplane:
            href: https://headplane.shublab.com/admin/
            icon: mdi-vpn
            description: VPN Management UI
        - Headscale:
            href: https://headscale.shublab.com
            icon: si-tailscale
            description: VPN Coordination Server

    - Infrastructure:
        - Longhorn:
            href: https://longhorn.shublab.com
            icon: longhorn.png
            description: Distributed Storage

    - Security:
        - Vaultwarden:
            href: https://vault.shublab.com
            icon: vaultwarden.png
            description: Password Manager
        - CrowdSec:
            icon: crowdsec.png
            description: Intrusion Detection

    - Monitoring:
        - Grafana:
            href: https://grafana.shublab.com
            icon: grafana.png
            description: Dashboards & Metrics

    - Applications:
        - SearXNG:
            href: https://search.shublab.com
            icon: searxng.png
            description: Private Search Engine
        - Tandoor:
            href: https://tandoor.shublab.com
            icon: tandoor-recipes.png
            description: Recipe Manager
        - TREK:
            href: https://trek.shublab.com
            icon: mdi-map-marker-path
            description: Travel Planner
        - Blog:
            href: https://blog.shublab.com
            icon: si-markdown
            description: Shubham's Notes
        - Better Booking Bot:
            href: https://booking-bot.shublab.com
            icon: mdi-badminton
            description: Automated Sports Slot Booking
        - Car Health Check:
            href: https://carhealth.shublab.com
            icon: mdi-car-cog
            description: UK Vehicle Tax/MOT/Buying-Signal Report
        - IT-Tools:
            href: https://it-tools.shublab.com
            icon: it-tools.png
            description: Developer utilities (encoders, converters, generators)
        - Uptime Kuma:
            href: https://uptime.shublab.com
            icon: uptime-kuma.png
            description: Status page and uptime monitoring

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: homelab
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: custom
        url: https://search.shublab.com/search?q=
        target: _blank
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: long
          hour12: false

  kubernetes.yaml: |
    mode: cluster
