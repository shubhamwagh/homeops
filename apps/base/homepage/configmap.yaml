apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  settings.yaml: |
    title: Shubham's Homelab
    background:
      image: https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1920&q=80
      blur: sm
      saturate: 50
      brightness: 50
      opacity: 30
    theme: dark
    color: slate
    headerStyle: boxed
    cardBlur: sm
    statusStyle: dot
    layout:
      Networking:
        style: row
        columns: 3
        icon: mdi-network
      Infrastructure:
        style: row
        columns: 3
        icon: mdi-server
      Security:
        style: row
        columns: 3
        icon: mdi-shield-lock
      Monitoring:
        style: row
        columns: 3
        icon: mdi-chart-line
      Applications:
        style: row
        columns: 4
        icon: mdi-apps

  bookmarks.yaml: |
    - Quick Links:
        - GitHub:
            - href: https://github.com/shubhamwagh/homeops
              icon: si-github
        - Cloudflare:
            - href: https://dash.cloudflare.com
              icon: si-cloudflare

  services.yaml: |
    - Networking:
        - Traefik:
            href: https://traefik.shublab.com
            icon: traefik.png
            description: Ingress Controller
        - Headplane:
            href: https://headplane.shublab.com/admin/
            icon: mdi-vpn
            description: VPN Management UI
        - Headscale:
            href: https://headscale.shublab.com
            icon: si-tailscale
            description: VPN Coordination Server

    - Infrastructure:
        - Longhorn:
            href: https://longhorn.shublab.com
            icon: longhorn.png
            description: Distributed Storage

    - Security:
        - Vaultwarden:
            href: https://vault.shublab.com
            icon: vaultwarden.png
            description: Password Manager
        - CrowdSec:
            href: https://grafana.shublab.com/d/hjmZdB4nk/crowdsec-security-engines-overview
            icon: crowdsec.png
            description: Intrusion Detection (via Grafana - CrowdSec itself has no web UI)

    - Monitoring:
        - Grafana:
            href: https://grafana.shublab.com
            icon: grafana.png
            description: Dashboards & Metrics
            widget:
              type: customapi
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=round(avg(max%20by%20(instance)%20(node_hwmon_temp_celsius%7Bchip%3D~%22platform_coretemp.%2A%22%7D))%2C0.1)
              refreshInterval: 30000
              mappings:
                - field: "data.result.0.value.1"
                  label: Avg Node Temp
                  format: text
                  suffix: "°C"
        - Uptime Kuma:
            href: https://uptime-kuma.shublab.com
            icon: mdi-heart-pulse
            description: Homelab status monitoring
            widget:
              type: uptimekuma
              url: https://uptime-kuma.shublab.com
              slug: homelab

    - Applications:
        - SearXNG:
            href: https://search.shublab.com
            icon: searxng.png
            description: Private Search Engine
        - Tandoor:
            href: https://tandoor.shublab.com
            icon: tandoor-recipes.png
            description: Recipe Manager
        - TREK:
            href: https://trek.shublab.com
            icon: mdi-map-marker-path
            description: Travel Planner
        - Blog:
            href: https://blog.shublab.com
            icon: si-markdown
            description: Shubham's Notes
        - Better Booking Bot:
            href: https://booking-bot.shublab.com
            icon: mdi-badminton
            description: Automated Sports Slot Booking
        - Car Health Check:
            href: https://carhealth.shublab.com
            icon: mdi-car-cog
            description: UK Vehicle Tax/MOT/Buying-Signal Report
        - Mailpit:
            href: https://mailpit.shublab.com
            icon: mdi-email
            description: Dev SMTP catch-all & email preview
        - Umami:
            href: https://umami.shublab.com
            icon: mdi-google-analytics
            description: Self-hosted blog analytics
        - Hermes Agent:
            href: https://hermes.shublab.com
            icon: mdi-robot
            description: Self-hosted AI homelab agent
        - Adminer:
            href: https://adminer.shublab.com
            icon: mdi-database
            description: Web DB admin client (Postgres/MySQL)

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: homelab
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: custom
        url: https://search.shublab.com/search?q=
        target: _blank
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: long
          hour12: false

  kubernetes.yaml: |
    mode: cluster
