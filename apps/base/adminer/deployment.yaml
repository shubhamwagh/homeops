apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: adminer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
        - name: adminer
          # Adminer: lightweight web-based database admin client
          # (https://www.adminer.org). It is a STATeless single-PHP-file app
          # with no backend of its own - it just logs into an external DB
          # (the homelab's shared Postgres/MySQL). No PVC needed (no local
          # state) and no Secret needed. Authentication happens at Adminer's
          # OWN login form (the user enters DB host/user/pass there), so there
          # is no Traefik basicAuth middleware and no middleware-auth.yaml.
          # Exposure is LAN/Tailscale-only by design (no public use).
          image: adminer:6.0.1-standalone
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
