apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          # Mailpit: zero-dependency SMTP test server + web UI. Acts as a dev
          # mail catcher for the homelab's own apps (car-health-check,
          # better-booking-bot, etc.) so outbound email can be inspected without
          # a real mail server. In-memory message store by default (no PVC
          # needed); SMTP listens on 1025, web UI on 8025. Web UI is gated by
          # Traefik basicAuth (see middleware-auth.yaml) - the credentials are
          # created out of band via `make hermes-secret`.
          image: axllent/mailpit:v1.31.0
          env:
            # Accept any SMTP auth so apps can relay without real credentials.
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "1"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "1"
            # No MP_UI_AUTH var here on purpose: Mailpit enables its own auth
            # the moment this var is SET to any value (including "none",
            # which isn't valid credentials and made every request - even the
            # liveness probe - get 401'd and crash-loop indefinitely).
            # Omitting it entirely is the actual way to disable app-level
            # auth; Traefik basicAuth (middleware-auth.yaml) is the real gate.
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          livenessProbe:
            httpGet:
              path: /
              port: 8025
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8025
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
