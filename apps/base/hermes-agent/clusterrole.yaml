# hermes-operator: Hermes' normal daily SRE authority (GREEN/YELLOW tier per
# CLAUDE.md "Hermes Autonomy Policy"). Broad but explicitly enumerated -
# ordinary application/workload resources get real write access; anything
# with irreversible blast radius (Secrets, PVC/PV, Namespaces, RBAC, CRDs,
# node/host access) stays out of this role entirely - those are RED-tier,
# gated behind the separate hermes-critical-operator break-glass role
# (see clusterrole-critical.yaml), never bound to this ServiceAccount by
# default. No wildcard resources or verbs anywhere in this file.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-operator
rules:
  # Core API - read broadly, write only what's explicitly ordinary/reversible.
  # No Secrets. No PVC/PV writes (RED). No Namespace writes (RED). Pods:
  # delete only (a "restart" is a delete - the owning controller recreates
  # it; Hermes never creates bare unmanaged Pods directly).
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
      - events
      - persistentvolumeclaims
      - persistentvolumes
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
    verbs: [get, list, watch, delete]
  - apiGroups: [""]
    resources:
      - services
      - configmaps
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources:
      - endpoints
    verbs: [get, list, watch]

  # apps - workload controllers. Deployments/StatefulSets/DaemonSets get full
  # ordinary write access (+ /scale). ReplicaSets stay delete/patch only -
  # Deployments own them; direct create is unusual.
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["apps"]
    resources:
      - deployments/scale
      - statefulsets/scale
    verbs: [get, update, patch]
  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs: [get, list, watch, patch, delete]

  # batch - jobs/cronjobs are meant to be created directly (unlike bare Pods)
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: [get, list, watch, create, update, patch, delete]

  # networking - ingresses are ordinary app config; ingressclasses/
  # networkpolicies stay read-only (shared/security-adjacent, not
  # "ordinary application" resources)
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingressclasses
      - networkpolicies
    verbs: [get, list, watch]

  # autoscaling - HPAs, where used
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: [get, list, watch, create, update, patch, delete]

  # storage - stays fully read-only. Deleting/modifying PVCs, PVs, or
  # StorageClasses is RED-tier regardless of how routine it looks.
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - csidrivers
      - csinodes
      - volumeattachments
    verbs: [get, list, watch]

  # metrics-server - resource utilisation
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: [get, list]

  # Flux - read + patch only (patch covers reconcile-now via the
  # reconcile.fluxcd.io/requestedAt annotation, and suspend/resume via
  # spec.suspend) - Hermes doesn't create new top-level Kustomization/
  # HelmRelease objects directly; new apps go through HomeOps Git, which
  # the existing base kustomization.yaml already picks up automatically.
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources:
      - helmreleases
    verbs: [get, list, watch, patch]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources:
      - kustomizations
    verbs: [get, list, watch, patch]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources:
      - gitrepositories
      - helmrepositories
      - helmcharts
    verbs: [get, list, watch, patch]

  # Longhorn - read-only. Deleting/modifying volumes, replicas, backups,
  # or recurring jobs is RED-tier (storage/data-safety), full stop.
  - apiGroups: ["longhorn.io"]
    resources:
      - volumes
      - replicas
      - engines
      - nodes
      - backups
      - backuptargets
      - recurringjobs
      - snapshots
    verbs: [get, list, watch]

  # Cilium - read-only (network platform config, not an ordinary app resource)
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumnodes
      - ciliumendpoints
      - ciliumloadbalancerippools
      - ciliuml2announcementpolicies
    verbs: [get, list, watch]

  # Traefik - IngressRoute/Middleware read-only for now (platform-adjacent);
  # ordinary apps in this repo route through core Ingress, which is writable
  # above
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutes
      - middlewares
    verbs: [get, list, watch]

  # cert-manager - read-only. Certificate/issuer lifecycle stays out of
  # routine autonomy; a stuck cert is diagnosed, not force-fixed here.
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
      - clusterissuers
    verbs: [get, list, watch]
  - apiGroups: ["acme.cert-manager.io"]
    resources:
      - challenges
      - orders
    verbs: [get, list, watch]

# Explicitly NOT granted anywhere in this role: secrets (any apiGroup), any
# write verb on PVC/PV/StorageClass/Namespace/Longhorn/CRDs, pods/exec,
# pods/attach, pods/portforward, serviceaccounts/token, any RBAC resource,
# certificatesigningrequests/approval, or any cluster-admin aggregation.
# All of that is RED-tier - see clusterrole-critical.yaml, which is never
# bound to this ServiceAccount by default.
