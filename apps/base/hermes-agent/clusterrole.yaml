# hermes-operator-read: cluster-wide OBSERVATION only. Every resource here
# is get/list/watch (or get/list for metrics.k8s.io, which has no watch)
# regardless of namespace - this is the visibility layer, not the write
# layer. Write access for ordinary workloads lives in a separate ClusterRole
# (clusterrole-write.yaml) bound only via namespace-scoped RoleBindings
# (rolebindings-write.yaml), not this ClusterRoleBinding - see CLAUDE.md
# "Hermes Autonomy Policy" for why cluster-wide write access was removed
# from this role. No wildcard resources or verbs anywhere in this file.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-operator-read
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
      - events
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - pods/log
      - services
      - configmaps
      - endpoints
    verbs: [get, list, watch]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: [get, list, watch]

  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: [get, list, watch]

  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - ingressclasses
      - networkpolicies
    verbs: [get, list, watch]

  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: [get, list, watch]

  # Storage - read-only. Writing PVCs/PVs/StorageClasses is RED-tier
  # regardless of how routine it looks.
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - csidrivers
      - csinodes
      - volumeattachments
    verbs: [get, list, watch]

  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: [get, list]

  # Flux - read-only here. The narrow `patch` capability (reconcile-now /
  # suspend / resume) lives in clusterrole-flux-reconcile.yaml, bound only
  # in the specific namespaces that actually hold a Kustomization or
  # HelmRelease - never cluster-wide, never bundled with general write
  # access to those namespaces.
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources:
      - helmreleases
    verbs: [get, list, watch]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources:
      - kustomizations
    verbs: [get, list, watch]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources:
      - gitrepositories
      - helmrepositories
      - helmcharts
    verbs: [get, list, watch]

  # Longhorn - read-only. Deleting/modifying volumes, replicas, backups,
  # or recurring jobs is RED-tier (storage/data-safety), full stop.
  - apiGroups: ["longhorn.io"]
    resources:
      - volumes
      - replicas
      - engines
      - nodes
      - backups
      - backuptargets
      - recurringjobs
      - snapshots
    verbs: [get, list, watch]

  # Cilium - read-only (network platform config, not an ordinary app resource)
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumnodes
      - ciliumendpoints
      - ciliumloadbalancerippools
      - ciliuml2announcementpolicies
    verbs: [get, list, watch]

  # Traefik - read-only (platform-adjacent CRDs)
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutes
      - middlewares
    verbs: [get, list, watch]

  # cert-manager - read-only. Certificate/issuer lifecycle stays out of
  # routine autonomy; a stuck cert is diagnosed, not force-fixed here.
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
      - clusterissuers
    verbs: [get, list, watch]
  - apiGroups: ["acme.cert-manager.io"]
    resources:
      - challenges
      - orders
    verbs: [get, list, watch]

# Explicitly NOT granted anywhere in this role: secrets (any apiGroup), any
# write verb whatsoever, pods/exec, pods/attach, pods/portforward,
# serviceaccounts/token, any RBAC resource, certificatesigningrequests/
# approval, or any cluster-admin aggregation. All write access - ordinary
# or critical - lives in other, more narrowly-bound roles.
