apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - serviceaccount-critical.yaml
  - clusterrole-critical.yaml
  - elevation-revoker.yaml
  - configmap-sops-recipient.yaml
  - secret.sops.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - middleware-auth.yaml
  - secret-webui-auth.sops.yaml
  - secret-webui-auth-plaintext.sops.yaml
  - ingress.yaml
# High-autonomy operator tier (see CLAUDE.md "Hermes Autonomy Policy").
# hermes-operator (bound) covers ordinary GREEN/YELLOW write access to
# workload resources; hermes-critical-operator (defined, never bound by
# default) covers RED-tier destructive ops, activated only via
# `make hermes-elevate` after explicit approval. Still zero Secrets access,
# zero exec/attach/port-forward, zero node/host access, zero SSH - always,
# elevated or not. Model provider (ANTHROPIC_API_KEY / OPENAI_API_KEY)
# intentionally not set - decide and add via `sops` later.
