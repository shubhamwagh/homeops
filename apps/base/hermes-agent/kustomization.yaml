apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - configmap-sops-recipient.yaml
  - secret.sops.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - middleware-auth.yaml
  - secret-webui-auth.sops.yaml
  - ingress.yaml
# Observability-first, least-privilege deployment (phase 1). ClusterRole
# grants get/list/watch only, no Secrets access anywhere, no exec/attach/
# port-forward, no node/host access, no SSH. Model provider (ANTHROPIC_API_KEY /
# OPENAI_API_KEY) intentionally not set - decide and add via `sops` later.
