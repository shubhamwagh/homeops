apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pvc.yaml
  - secret.sops.yaml
  - secret-ssh.sops.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
# ANTHROPIC_API_KEY / OPENAI_API_KEY intentionally omitted from
