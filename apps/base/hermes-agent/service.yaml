apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  selector:
    app: hermes-agent
  ports:
    - name: webui
      port: 8787
      targetPort: 8787
    - name: dashboard
      port: 9119
      targetPort: 9119
    - name: gateway
      port: 8642
      targetPort: 8642
