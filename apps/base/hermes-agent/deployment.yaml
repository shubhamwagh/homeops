apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes-agent
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      containers:
        - name: hermes-suite
          image: ascensionoid/hermes-suite:latest
          env:
            - name: HERMES_WEBUI_DEFAULT_WORKSPACE
              value: /opt/data/workspace
          envFrom:
            - secretRef:
                name: hermes-agent-secret
          ports:
            - name: webui
              containerPort: 8787
            - name: dashboard
              containerPort: 9119
            - name: gateway
              containerPort: 8642
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: ssh
              mountPath: /etc/hermes-ssh
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        - name: ssh
          secret:
            secretName: hermes-agent-ssh
            defaultMode: 0400
