apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes-agent
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      serviceAccountName: hermes-homelab
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes-suite
          image: ghcr.io/shubhamwagh/hermes-suite-sre:2026.7.20-0.52.106-sre.1c0ecd8
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: webui
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: webui
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: webui
            periodSeconds: 20
            failureThreshold: 3
          env:
            - name: HERMES_WEBUI_DEFAULT_WORKSPACE
              value: /opt/data/workspace
          envFrom:
            - secretRef:
                name: hermes-agent-secret
          ports:
            - name: webui
              containerPort: 8787
            - name: dashboard
              containerPort: 9119
            - name: gateway
              containerPort: 8642
          volumeMounts:
            - name: data
              mountPath: /opt/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
