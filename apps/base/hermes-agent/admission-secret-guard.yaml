# Admission guardrail for system:serviceaccount:hermes-agent:hermes-homelab
# ONLY (via matchConditions - Flux and every other identity are completely
# unaffected). Narrows, but does not close, the gap RBAC alone leaves: Hermes
# has no `get secrets` anywhere, but workload write + pod-log read could
# otherwise be used to introduce a NEW Secret reference into a workload and
# read it back out via logs. This policy stops that specific move. It does
# NOT stop Hermes from exploiting a Secret reference a workload ALREADY has
# (e.g. patching a container's command to print an existing env var sourced
# from a Secret, then reading it via pods/log) - that residual risk is
# accepted as ordinary application-operator authority in the 8 ordinary
# namespaces this binds in, and is exactly why protected/platform namespaces
# stay read-only instead of getting this same write+guardrail combination.
# See CLAUDE.md "Hermes Autonomy Policy" for the full threat model.
#
# Rule, in both policies below: a create/update from Hermes is DENIED if it
# introduces a NEW or CHANGED secretKeyRef/secretRef/secret-volume/
# imagePullSecret (an unchanged existing reference is always allowed - this
# is what keeps already-secret-using apps like car-health-check and
# better-booking-bot still routinely patchable by Hermes), OR if it sets/
# changes serviceAccountName, OR introduces privileged/hostPath/hostNetwork/
# hostPID/hostIPC/added-capabilities anywhere in the pod template.
#
# On CREATE, oldObject is null, so every "must have existed in oldObject"
# check evaluates false - meaning Hermes cannot create a brand new workload
# with ANY secret reference at all, matching "arbitrary workload creation
# could mount an existing Secret" from the review.
#
# Two policies because Deployment/StatefulSet/DaemonSet/ReplicaSet/Job all
# share the `.spec.template.spec` pod-template path, while CronJob nests it
# one level deeper (`.spec.jobTemplate.spec.template.spec`) - same rules,
# different path.
#
# ENFORCEMENT STATUS: validationActions is [Deny, Audit] - live enforcement,
# not just warnings. Burn-in was done via [Warn, Audit] first, then an
# 11-case server-side dry-run test matrix (2 expected-allow: resource/image
# change on an app with an existing untouched secretRef; 1 expected-allow:
# ordinary pod delete; 8 expected-deny: new secretKeyRef, changed secretRef
# name, new secret volume, changed serviceAccountName, hostPath, privileged,
# added capabilities, hostNetwork) all passed exactly as expected against the
# real car-health-check Deployment before switching off Warn/Audit - see the
# session that added this file for the actual dry-run output.
#
# CEL note: the "unchanged reference" comparison matches by (secret name,
# key) or (secret name) regardless of which container/array-position it's
# in, and regardless of container add/remove elsewhere in the same edit -
# deliberately coarser than a strict positional diff. The failure mode of
# this coarseness only ever points toward DENY (blocking a legitimate change
# that happens to look structurally different), never toward ALLOW - it
# cannot be tricked into permitting a genuinely new secret reference.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hermes-secret-guard-workloads
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  matchConditions:
    - name: hermes-service-account-only
      expression: >-
        request.userInfo.username == "system:serviceaccount:hermes-agent:hermes-homelab"
  variables:
    - name: newPodSpec
      expression: "object.spec.template.spec"
    - name: oldPodSpec
      expression: "oldObject != null ? oldObject.spec.template.spec : null"
    - name: newAllContainers
      expression: >-
        variables.newPodSpec.containers +
        (has(variables.newPodSpec.initContainers) ? variables.newPodSpec.initContainers : [])
    - name: oldAllContainers
      expression: >-
        variables.oldPodSpec == null ? [] :
        variables.oldPodSpec.containers +
        (has(variables.oldPodSpec.initContainers) ? variables.oldPodSpec.initContainers : [])
  validations:
    # 1. No new/changed env[].valueFrom.secretKeyRef
    - expression: >-
        variables.newAllContainers.all(c,
          !has(c.env) || c.env.all(e,
            !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
            variables.oldAllContainers.exists(oc,
              has(oc.env) && oc.env.exists(oe,
                has(oe.valueFrom) && has(oe.valueFrom.secretKeyRef) &&
                oe.valueFrom.secretKeyRef.name == e.valueFrom.secretKeyRef.name &&
                oe.valueFrom.secretKeyRef.key == e.valueFrom.secretKeyRef.key
              )
            )
          )
        )
      messageExpression: >-
        "hermes-secret-guard: introduces or changes a container env secretKeyRef - not allowed for this identity"
    # 2. No new/changed envFrom[].secretRef
    - expression: >-
        variables.newAllContainers.all(c,
          !has(c.envFrom) || c.envFrom.all(ef,
            !has(ef.secretRef) ||
            variables.oldAllContainers.exists(oc,
              has(oc.envFrom) && oc.envFrom.exists(oef,
                has(oef.secretRef) && oef.secretRef.name == ef.secretRef.name
              )
            )
          )
        )
      messageExpression: >-
        "hermes-secret-guard: introduces or changes an envFrom secretRef - not allowed for this identity"
    # 3. No new/changed Secret volumes
    - expression: >-
        !has(variables.newPodSpec.volumes) || variables.newPodSpec.volumes.all(v,
          !has(v.secret) ||
          (variables.oldPodSpec != null && has(variables.oldPodSpec.volumes) &&
            variables.oldPodSpec.volumes.exists(ov,
              has(ov.secret) && ov.secret.secretName == v.secret.secretName
            )
          )
        )
      messageExpression: >-
        "hermes-secret-guard: introduces or changes a Secret volume - not allowed for this identity"
    # 4. No new/changed imagePullSecrets
    - expression: >-
        !has(variables.newPodSpec.imagePullSecrets) || variables.newPodSpec.imagePullSecrets.all(s,
          variables.oldPodSpec != null && has(variables.oldPodSpec.imagePullSecrets) &&
          variables.oldPodSpec.imagePullSecrets.exists(os, os.name == s.name)
        )
      messageExpression: >-
        "hermes-secret-guard: introduces or changes imagePullSecrets - not allowed for this identity"
    # 5. serviceAccountName cannot be introduced or changed
    - expression: >-
        (!has(variables.newPodSpec.serviceAccountName) && !has(variables.newPodSpec.serviceAccount)) ||
        (variables.oldPodSpec != null &&
          (has(variables.newPodSpec.serviceAccountName) ? variables.newPodSpec.serviceAccountName : "") ==
          (has(variables.oldPodSpec.serviceAccountName) ? variables.oldPodSpec.serviceAccountName : "")
        )
      messageExpression: >-
        "hermes-secret-guard: introduces or changes serviceAccountName - not allowed for this identity"
    # 6. No privileged containers
    - expression: >-
        variables.newAllContainers.all(c,
          !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false
        )
      messageExpression: '"hermes-secret-guard: privileged containers are not allowed for this identity"'
    # 7. No added Linux capabilities
    - expression: >-
        variables.newAllContainers.all(c,
          !has(c.securityContext) || !has(c.securityContext.capabilities) ||
          !has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.size() == 0
        )
      messageExpression: '"hermes-secret-guard: adding Linux capabilities is not allowed for this identity"'
    # 8. No hostPath volumes
    - expression: >-
        !has(variables.newPodSpec.volumes) || variables.newPodSpec.volumes.all(v, !has(v.hostPath))
      messageExpression: '"hermes-secret-guard: hostPath volumes are not allowed for this identity"'
    # 9. No hostNetwork/hostPID/hostIPC
    - expression: >-
        (!has(variables.newPodSpec.hostNetwork) || variables.newPodSpec.hostNetwork == false) &&
        (!has(variables.newPodSpec.hostPID) || variables.newPodSpec.hostPID == false) &&
        (!has(variables.newPodSpec.hostIPC) || variables.newPodSpec.hostIPC == false)
      messageExpression: '"hermes-secret-guard: hostNetwork/hostPID/hostIPC are not allowed for this identity"'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hermes-secret-guard-cronjobs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["cronjobs"]
  matchConditions:
    - name: hermes-service-account-only
      expression: >-
        request.userInfo.username == "system:serviceaccount:hermes-agent:hermes-homelab"
  variables:
    - name: newPodSpec
      expression: "object.spec.jobTemplate.spec.template.spec"
    - name: oldPodSpec
      expression: "oldObject != null ? oldObject.spec.jobTemplate.spec.template.spec : null"
    - name: newAllContainers
      expression: >-
        variables.newPodSpec.containers +
        (has(variables.newPodSpec.initContainers) ? variables.newPodSpec.initContainers : [])
    - name: oldAllContainers
      expression: >-
        variables.oldPodSpec == null ? [] :
        variables.oldPodSpec.containers +
        (has(variables.oldPodSpec.initContainers) ? variables.oldPodSpec.initContainers : [])
  validations:
    - expression: >-
        variables.newAllContainers.all(c,
          !has(c.env) || c.env.all(e,
            !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) ||
            variables.oldAllContainers.exists(oc,
              has(oc.env) && oc.env.exists(oe,
                has(oe.valueFrom) && has(oe.valueFrom.secretKeyRef) &&
                oe.valueFrom.secretKeyRef.name == e.valueFrom.secretKeyRef.name &&
                oe.valueFrom.secretKeyRef.key == e.valueFrom.secretKeyRef.key
              )
            )
          )
        )
      messageExpression: >-
        "hermes-secret-guard: introduces or changes a container env secretKeyRef - not allowed for this identity"
    - expression: >-
        variables.newAllContainers.all(c,
          !has(c.envFrom) || c.envFrom.all(ef,
            !has(ef.secretRef) ||
            variables.oldAllContainers.exists(oc,
              has(oc.envFrom) && oc.envFrom.exists(oef,
                has(oef.secretRef) && oef.secretRef.name == ef.secretRef.name
              )
            )
          )
        )
      messageExpression: >-
        "hermes-secret-guard: introduces or changes an envFrom secretRef - not allowed for this identity"
    - expression: >-
        !has(variables.newPodSpec.volumes) || variables.newPodSpec.volumes.all(v,
          !has(v.secret) ||
          (variables.oldPodSpec != null && has(variables.oldPodSpec.volumes) &&
            variables.oldPodSpec.volumes.exists(ov,
              has(ov.secret) && ov.secret.secretName == v.secret.secretName
            )
          )
        )
      messageExpression: >-
        "hermes-secret-guard: introduces or changes a Secret volume - not allowed for this identity"
    - expression: >-
        !has(variables.newPodSpec.imagePullSecrets) || variables.newPodSpec.imagePullSecrets.all(s,
          variables.oldPodSpec != null && has(variables.oldPodSpec.imagePullSecrets) &&
          variables.oldPodSpec.imagePullSecrets.exists(os, os.name == s.name)
        )
      messageExpression: >-
        "hermes-secret-guard: introduces or changes imagePullSecrets - not allowed for this identity"
    - expression: >-
        (!has(variables.newPodSpec.serviceAccountName) && !has(variables.newPodSpec.serviceAccount)) ||
        (variables.oldPodSpec != null &&
          (has(variables.newPodSpec.serviceAccountName) ? variables.newPodSpec.serviceAccountName : "") ==
          (has(variables.oldPodSpec.serviceAccountName) ? variables.oldPodSpec.serviceAccountName : "")
        )
      messageExpression: >-
        "hermes-secret-guard: introduces or changes serviceAccountName - not allowed for this identity"
    - expression: >-
        variables.newAllContainers.all(c,
          !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false
        )
      messageExpression: '"hermes-secret-guard: privileged containers are not allowed for this identity"'
    - expression: >-
        variables.newAllContainers.all(c,
          !has(c.securityContext) || !has(c.securityContext.capabilities) ||
          !has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.size() == 0
        )
      messageExpression: '"hermes-secret-guard: adding Linux capabilities is not allowed for this identity"'
    - expression: >-
        !has(variables.newPodSpec.volumes) || variables.newPodSpec.volumes.all(v, !has(v.hostPath))
      messageExpression: '"hermes-secret-guard: hostPath volumes are not allowed for this identity"'
    - expression: >-
        (!has(variables.newPodSpec.hostNetwork) || variables.newPodSpec.hostNetwork == false) &&
        (!has(variables.newPodSpec.hostPID) || variables.newPodSpec.hostPID == false) &&
        (!has(variables.newPodSpec.hostIPC) || variables.newPodSpec.hostIPC == false)
      messageExpression: '"hermes-secret-guard: hostNetwork/hostPID/hostIPC are not allowed for this identity"'
---
# Start with [Warn, Audit] and observe for a burn-in period before switching
# to [Deny] - see header comment above. Change this list, then re-apply,
# when ready to enforce.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: hermes-secret-guard-workloads
spec:
  policyName: hermes-secret-guard-workloads
  validationActions: [Deny, Audit]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: hermes-secret-guard-cronjobs
spec:
  policyName: hermes-secret-guard-cronjobs
  validationActions: [Deny, Audit]
