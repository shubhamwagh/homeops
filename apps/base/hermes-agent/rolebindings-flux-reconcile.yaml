# Namespace-scoped grants of hermes-operator-flux-reconcile
# (clusterrole-flux-reconcile.yaml) - patch on Kustomization/HelmRelease
# ONLY, nothing else in these otherwise fully-protected namespaces. One
# entry per namespace that currently holds a Kustomization or HelmRelease,
# per `flux get kustomizations -A` / `flux get helmreleases -A`:
# flux-system (Kustomizations) + cert-manager, cnpg-system, crowdsec,
# kube-system, longhorn-system, monitoring, reflector, reloader, renovate,
# traefik, vaultwarden (HelmReleases).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-operator-flux-reconcile
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-operator-flux-reconcile
subjects:
  - kind: ServiceAccount
    name: hermes-homelab
    namespace: hermes-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-operator-flux-reconcile
