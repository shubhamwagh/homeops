# Narrowly-scoped identity used only to self-revoke a temporary elevation
# binding after its TTL expires (see `make hermes-elevate` in the Makefile).
# Safe to persist always: this ClusterRole can only get/delete ONE specific,
# fixed-name ClusterRoleBinding (hermes-critical-operator-elevated) -
# nothing else, no matter what.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-elevation-revoker
  namespace: hermes-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-elevation-revoker
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterrolebindings
    resourceNames: ["hermes-critical-operator-elevated"]
    verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-elevation-revoker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-elevation-revoker
subjects:
  - kind: ServiceAccount
    name: hermes-elevation-revoker
    namespace: hermes-agent
