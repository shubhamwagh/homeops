apiVersion: apps/v1
kind: Deployment
metadata:
  name: tandoor
  namespace: tandoor
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tandoor
  template:
    metadata:
      labels:
        app: tandoor
    spec:
      containers:
        - name: tandoor
          image: vabene1111/recipes:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              . venv/bin/activate
              until python -c "import psycopg2; psycopg2.connect(host='$POSTGRES_HOST',port=5432,dbname='$POSTGRES_DB',user='$POSTGRES_USER',password='$POSTGRES_PASSWORD')" 2>/dev/null; do echo "waiting for postgres..."; sleep 3; done
              python manage.py migrate
              python manage.py collectstatic --noinput
              gunicorn -b 0.0.0.0:8080 --workers 2 recipes.wsgi
          envFrom:
            - configMapRef:
                name: tandoor-config
            - secretRef:
                name: tandoor-secret
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: media
              mountPath: /opt/recipes/mediafiles
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: tandoor-media
