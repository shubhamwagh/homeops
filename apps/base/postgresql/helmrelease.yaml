apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: postgres
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.22.*"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: postgres
      interval: 24h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
