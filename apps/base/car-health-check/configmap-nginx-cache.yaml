apiVersion: v1
kind: ConfigMap
metadata:
  name: car-health-check-nginx-cache
  namespace: car-health-check
data:
  default.conf: |
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=carhealth_cache:10m max_size=200m inactive=7d use_temp_path=off;

    server {
      listen 8080;

      location / {
        proxy_pass http://car-health-check-app.car-health-check.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache each full request URI (path + querystring) — a /report?reg=XXXX
        # hit for the same plate is served from cache instead of re-calling the
        # Zyfy/DVSA APIs. Zyfy's free tier is 100 requests/month, so this matters.
        proxy_cache carhealth_cache;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 24h;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
      }
    }
