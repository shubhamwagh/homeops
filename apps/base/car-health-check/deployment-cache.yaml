apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-health-check-cache
  namespace: car-health-check
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: car-health-check-cache
  template:
    metadata:
      labels:
        app: car-health-check-cache
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: cache
              mountPath: /var/cache/nginx
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: conf
          configMap:
            name: car-health-check-nginx-cache
        - name: cache
          persistentVolumeClaim:
            claimName: car-health-check-cache-data
