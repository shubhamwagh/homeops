# Declares which SOPS-encrypted secret files contain HUMAN-ACCESS credentials
# (a person types this into a login / basic-auth prompt somewhere) versus
# MACHINE-ONLY credentials (consumed only by a pod/service - no routine reason
# a human ever needs to read them). See CLAUDE.md "Secret Handling" for the
# full policy. This file contains no secret values - only pointers - and is
# NOT gitignored.
#
# `recoverable: true`  - `sops -d` yields the literal, usable credential.
# `recoverable: false` - the file only stores a one-way hash (htpasswd/bcrypt/
#   apr1). The plaintext existed only at the moment the credential was
#   created and, if not captured then (into .secrets-plaintext or
#   Vaultwarden), is gone for good short of rotating it. `make secret` /
#   `make secrets-plaintext` still show these, clearly marked [HASH ONLY].

human_access:
  - file: infrastructure/base/monitoring/kube-prometheus-stack/secret-grafana-admin.sops.yaml
    label: grafana
    field: stringData.admin-password
    recoverable: true

  # traefik/longhorn/*-webui-auth: the htpasswd hash (`data.users`, what
  # Traefik's basicAuth middleware actually consumes) and the plaintext live
  # in TWO SEPARATE files, not the same object - Traefik's basicAuth loader
  # requires the Secret it points at to contain exactly one element, so the
  # plaintext can't be added alongside the hash there. The `-plaintext.sops.yaml`
  # companion file is never referenced by any Middleware.
  - file: infrastructure/base/networking/traefik/secret-dashboard-auth-plaintext.sops.yaml
    label: traefik
    field: stringData.password
    recoverable: true

  - file: infrastructure/base/storage/longhorn/secret-basic-auth-plaintext.sops.yaml
    label: longhorn
    field: stringData.password
    recoverable: true

  - file: apps/base/trek/secret.sops.yaml
    label: trek-admin
    field: stringData.ADMIN_PASSWORD
    recoverable: true

  - file: apps/base/better-booking-bot/secret-webui-auth-plaintext.sops.yaml
    label: better-booking-bot-webui
    field: stringData.password
    recoverable: true

  - file: apps/base/car-health-check/secret-webui-auth-plaintext.sops.yaml
    label: car-health-check-webui
    field: stringData.password
    recoverable: true

  - file: apps/base/hermes-agent/secret.sops.yaml
    label: hermes-dashboard
    field: stringData.DASHBOARD_CREDENTIAL
    recoverable: true

  - file: apps/base/hermes-agent/secret-webui-auth-plaintext.sops.yaml
    label: hermes-webui
    field: stringData.password
    recoverable: true

# MACHINE-ONLY: consumed by pods/services only. Deliberately not decrypted by
# `make secret` / `make secrets-plaintext` - use `sops -d <file>` directly if
# you genuinely need to inspect one (e.g. for debugging a broken app).
machine_only:
  - apps/base/better-booking-bot/secret.sops.yaml
  - apps/base/car-health-check/secret.sops.yaml
  - apps/base/tandoor/secret.sops.yaml
  - infrastructure/base/controllers/renovate/secret.sops.yaml
  - infrastructure/base/networking/cert-manager/secret-cloudflare.sops.yaml
  - infrastructure/base/networking/cloudflared/secret.sops.yaml
  - infrastructure/base/networking/headplane/secret.sops.yaml
  - infrastructure/base/searxng/secret.sops.yaml
  - infrastructure/base/github-token-broker/secret-app-key.sops.yaml
  - infrastructure/config/base/postgres/secret-tandoor-user.sops.yaml
