name: Cluster Health

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # manual trigger

jobs:
  health:
    name: Health Check
    runs-on: self-hosted      # runs on node1 — needs GitHub Actions runner installed
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run health checks
        run: make check
