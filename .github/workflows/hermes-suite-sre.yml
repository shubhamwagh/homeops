name: Build hermes-suite-sre

on:
  push:
    branches: [main]
    paths:
      - "docker/hermes-suite-sre/**"
      - ".github/workflows/hermes-suite-sre.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tag from Dockerfile ARGs + commit SHA
        id: tag
        run: |
          AGENT_VERSION=$(grep -m1 '^ARG AGENT_VERSION=' docker/hermes-suite-sre/Dockerfile | cut -d= -f2)
          echo "tag=${AGENT_VERSION}-sre.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # amd64 only - every current k3s node (node1/node2/node3) is amd64.
      # Add linux/arm64 to platforms below if that ever changes.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/hermes-suite-sre/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/shubhamwagh/hermes-suite-sre:${{ steps.tag.outputs.tag }}
