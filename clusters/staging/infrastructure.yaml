apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  timeout: 1h
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/staging
  decryption:
    provider: sops
    secretRef:
      name: sops-age
